# Build and publish Go-based Docker image on release
name: "Build and Publish Go Docker Image"

on:
  release:
    types: [published] # Trigger only when a release is published

# Add permissions to write packages
permissions:
  contents: read # Needed to checkout the code
  packages: write # Needed to push docker image to GHCR

env:
  # Update the image name for your repository
  NIU_BASE_IMG: ghcr.io/${{ github.repository }}

jobs:
  docker-build-publish-go:
    name: Build and Publish Go Docker image (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check tag matches VERSION file
        id: version_check
        run: |
          # Extract version from VERSION file
          version=$(cat VERSION)
          # Get the tag name from the release event (e.g., "v1.2.3" or "1.2.3")
          release_tag="${{ github.ref_name }}"
          # Strip 'v' prefix if present
          tag_version=${release_tag#v}

          if [ "${tag_version}" != "${version}" ]; then
            echo "Error: Release tag '${release_tag}' (version '${tag_version}') does not match VERSION file '${version}'." >&2
            exit 1
          else
            echo "Version check passed. Building Go Docker image for version ${version} from tag ${release_tag}."
            # Set the version as a step output
            echo "version=${version}" >> $GITHUB_OUTPUT
            echo "release_tag=${release_tag}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.NIU_BASE_IMG }}
          tags: |
            # Tag with the release version (e.g., 0.1.6)
            type=raw,value=${{ steps.version_check.outputs.version }}
            # Tag with major.minor (e.g., 0.1)
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version_check.outputs.version }}
            # Tag with major (e.g., 0)
            type=semver,pattern={{major}},value=${{ steps.version_check.outputs.version }}
            # Tag with 'latest'
            type=raw,value=latest

      - name: Get build time
        id: build_time
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch Go Docker image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version_check.outputs.release_tag }}
            BUILD_TIME=${{ steps.build_time.outputs.build_time }}
          # Add caching using GitHub Actions cache
          cache-from: type=gha,scope=${{ github.workflow }}-go
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-go
