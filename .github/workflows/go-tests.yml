# Run Go tests and checks on every push and PR that can affect the Go build.
# Documentation-only pushes skip this workflow. The filter is deliberately not
# applied to the pull_request trigger: skipping a workflow whose check is
# required by branch protection leaves the PR waiting forever for a status that
# will never be reported.
name: "Go Tests and Checks"

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]

# Least privilege: the job reads the repository and uploads an artifact, nothing
# more. verify.yml in the dotfiles checkout sets the same.
permissions:
  contents: read

env:
  # Exact patch, and one source for it: setup-go's input and the files its cache
  # key hashes both read this. Never a floating minor. "1.23" resolved to
  # 1.23.12, which go.mod's `toolchain go1.24.4` then overrode by downloading
  # go1.24.4 at run time -- so the toolchain setup-go installed was not the one
  # that compiled, and its cache key named a version GOCACHE never saw.
  GO_VERSION: '1.24.4'

jobs:
  test:
    name: Go Tests and Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-go keys its cache on the files in cache-dependency-path, restores
      # with NO restore-key, and returns early from its save when the primary key
      # already exists. An unrotated key is therefore frozen at whatever the first
      # run happened to put in GOCACHE, and can never repair itself.
      # .github/go-build-cache-epoch is the lever that rotates it. This step fails
      # closed when the epoch file disappears: hashFiles returns the empty string
      # for a path matching nothing, and setup-go throws only when EVERY named
      # path matches nothing, so a missing epoch would silently fall back to the
      # frozen key.
      - name: the cache key's epoch file is present
        run: test -s "$GITHUB_WORKSPACE/.github/go-build-cache-epoch" || { echo ".github/go-build-cache-epoch is missing or empty; the Go cache key would fall back to a frozen snapshot" >&2; exit 1; }

      # Go 1.24.4 is not in the ubuntu-latest image, so setup-go downloads and
      # extracts it: measured 2026-10-06 on this repo, 16s cold and 12s warm
      # (warm because its cache restore happens inside this step too).
      # Restoring the tree first lets setup-go find the version it was about to
      # install. Same step as verify.yml in the dotfiles checkout, where it took
      # setup-go from 23s to 2-3s. Keyed on OS, architecture and version only,
      # and deliberately not on the epoch: the toolchain is the same for every
      # run, so sharing one entry is the point. If setup-go stops finding it and
      # installs anyway, this step is dead weight and comes out.
      - name: cache the Go toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go/${{ env.GO_VERSION }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}

      # Keep the cache on: setup-go caches the go-build cache as well as the
      # module cache, and the go-build half is what `go test -race` spends its
      # time on. The manual step this replaced covered only ~/go/pkg/mod, so it
      # left race-instrumented std to be recompiled on every run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            .github/go-build-cache-epoch

      - name: Download Go modules
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            echo "Please run 'go fmt ./...' to fix formatting issues."
            exit 1
          fi

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test build for multiple platforms
        run: |
          # Test that cross-compilation works
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/test-linux .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/test-darwin .
          echo "Cross-compilation test passed"

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: coverage-report
          path: coverage.out
